
services:
  # 1. A Base de Dados Central (PostgreSQL)
  cooktok-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: cooktok_server_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Microsserviço de Utilizadores (Perfis, Amigos)
  user-service:
    # (O colega criará um Dockerfile focado no servidor Node.js nesta pasta)
    build: ./user-service
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=cooktok-db
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
    depends_on:
      - cooktok-db

  # 3. Microsserviço de Receitas (Feed, Inventário)
  recipe-service:
    build: ./recipe-service
    ports:
      - "8082:8080"
    environment:
      - DB_HOST=cooktok-db
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
    depends_on:
      - cooktok-db

volumes:
  postgres_data: