version: '3.8'

services:
  # 1. Base de Dados Central (O Servidor, não o SQLite)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cooktok_user
      POSTGRES_PASSWORD: cooktok_password
      POSTGRES_DB: cooktok_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Serviço de Utilizadores (Perfis, Amigos, Estatísticas)
  user-service:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=db
      - DB_USER=cooktok_user
      - DB_PASSWORD=cooktok_password
    depends_on:
      - db

  # 3. Serviço de Receitas (Feed, Pesquisa de Inventário, Vídeos)
  recipe-service:
    build: .
    ports:
      - "8082:8080"
    environment:
      - DB_HOST=db
      - DB_USER=cooktok_user
      - DB_PASSWORD=cooktok_password
    depends_on:
      - db

volumes:
  postgres_data: