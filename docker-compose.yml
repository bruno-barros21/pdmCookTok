services:
  cooktok-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: cooktok_server_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  user-service:
    build: ./user-service
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=cooktok-db
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=cooktok_server_db
    depends_on:
      - cooktok-db

  recipe-service:
    build: ./recipe-service
    ports:
      - "8082:8080"
    environment:
      - DB_HOST=cooktok-db
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=cooktok_server_db
    depends_on:
      - cooktok-db

  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - recipe-service

volumes:
  postgres_data: